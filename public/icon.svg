<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" fill="url(#bg)" rx="96"/>

  <!-- 書類（请求書）本体 -->
  <rect x="124" y="88" width="228" height="296" rx="14" fill="white"/>

  <!-- 折れ角 -->
  <polygon points="296,88 352,144 296,144" fill="#e8e0f5"/>
  <polygon points="296,88 352,144 352,88" fill="white" opacity="0.4"/>

  <!-- ヘッダーライン（タイトル部分） -->
  <rect x="148" y="172" width="160" height="14" rx="7" fill="#764ba2" opacity="0.55"/>
  <rect x="148" y="196" width="100" height="10" rx="5" fill="#667eea" opacity="0.3"/>

  <!-- 区切り線 -->
  <rect x="148" y="222" width="192" height="2" rx="1" fill="#764ba2" opacity="0.15"/>

  <!-- 明細行 -->
  <rect x="148" y="238" width="130" height="9" rx="4.5" fill="#667eea" opacity="0.25"/>
  <rect x="290" y="238" width="50" height="9" rx="4.5" fill="#764ba2" opacity="0.35"/>

  <rect x="148" y="258" width="118" height="9" rx="4.5" fill="#667eea" opacity="0.25"/>
  <rect x="290" y="258" width="50" height="9" rx="4.5" fill="#764ba2" opacity="0.35"/>

  <rect x="148" y="278" width="140" height="9" rx="4.5" fill="#667eea" opacity="0.25"/>
  <rect x="290" y="278" width="50" height="9" rx="4.5" fill="#764ba2" opacity="0.35"/>

  <!-- 合計区切り -->
  <rect x="148" y="304" width="192" height="2" rx="1" fill="#764ba2" opacity="0.2"/>

  <!-- 合計金額 -->
  <rect x="148" y="318" width="70" height="11" rx="5.5" fill="#667eea" opacity="0.3"/>
  <rect x="238" y="316" width="102" height="15" rx="7.5" fill="#764ba2" opacity="0.55"/>

  <!-- ¥ マーク（円マーク） -->
  <text x="256" y="440" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="72" font-weight="800" fill="white" opacity="0.92">¥</text>
</svg>
